[project]
name = "mcp-catastro"
version = "2.0.0"
description = "Servidor MCP para consultar el Catastro de España"
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "httpx>=0.25.2,<1",
    "mcp>=2,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
openai = ["openai>=3,<4"]

[dependency-groups]
dev = [
    "black>=23.11",
    "flake8>=6.1",
    "isort>=5.12",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.9",
]

[tool.uv]
package = false
required-version = ">=0.9.7"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
